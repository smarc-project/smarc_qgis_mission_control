name: Import checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out plugin repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check imports
        run: uv run --no-sync ruff check src/
